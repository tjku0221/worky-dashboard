/* ═══════════════════════════════════════════════════════════════════════════
   Reviews pane
   ─────────────────────────────────────────────────────────────────────────── */
function renderReviews() {
  const el = document.getElementById('pane-reviews');
  if (!st.merchants.length) { el.innerHTML=empty('cog','尚未設定店鋪','請先上傳店鋪設定資料'); return; }
  if (!st.orders.length)    { el.innerHTML=empty('folder','尚未匯入工作單','請上傳工作單資料'); return; }

  const sample = st.orders[0];
  const col = k => Object.keys(sample).find(h => h.includes(k));
  const reviewCol=col('滿意度'), endCol=col('工作結束時間')||col('結束時間');
  const startCol=col('工作開始時間')||col('開始時間');
  const workerCol=col('打工夥伴姓名');
  const actualInCol=col('打卡時間-上班'), actualOutCol=col('打卡時間-下班');
  const hasPunchCols = !!(actualInCol || actualOutCol);
  const storeCol=col('店鋪名稱'), branchCol=col('分店');
  const statusCol=Object.keys(sample).find(h=>h.trim()==='狀態')||col('狀態');
  const orderNumCol=col('工單號碼'), adjustCol=col('申請調整單據');

  if (!reviewCol || !endCol) { el.innerHTML=empty('cog','資料欄位不完整','找不到「滿意度」或「工作結束時間」欄位'); return; }

  const pending = [];
  st.orders.forEach(row => {
    if (statusCol && str(row[statusCol])!=='工作結束') return;
    if (str(row[reviewCol])!=='') return;
    const storeName=storeCol?str(row[storeCol]):'', branchName=branchCol?str(row[branchCol]):'';
    if (!findMerchant(storeName, branchName||storeName)) return;
    pending.push({
      branch:branchName||storeName, company:storeName,
      worker:str(row[workerCol])||'—',
      workDate:str(row[endCol]).slice(0,10),
      orderNum:orderNumCol?cleanId(row[orderNumCol]):'',
      adjust:adjustCol?str(row[adjustCol]):'',
      startTime:startCol?extractTime(str(row[startCol])):'',
      endTime:extractTime(str(row[endCol])),
      actualIn:actualInCol?str(row[actualInCol]):'',
      actualOut:actualOutCol?str(row[actualOutCol]):''
    });
  });

  pending.sort((a,b) => {
    const c=a.company.localeCompare(b.company,'zh-Hant'); if(c!==0) return c;
    const c2=(a.branch||a.company).localeCompare(b.branch||b.company,'zh-Hant'); if(c2!==0) return c2;
    return a.workDate.localeCompare(b.workDate);
  });
  pending.forEach(p => { p._key=p.branch+'|'+p.worker+'|'+p.workDate; });
  st._lastPending = pending;

  // group by merchant
  const groupMap = new Map();
  pending.forEach(p => {
    const k = p.company + '|||' + p.branch;
    if (!groupMap.has(k)) groupMap.set(k, { company:p.company, branch:p.branch, rows:[] });
    groupMap.get(k).rows.push(p);
  });
  const groups = [...groupMap.values()];
  st._reviewGroups = groups;

  const headerBar = `
    <div class="filter-bar">
      <span class="f-title">待評論工作單</span>
      <span class="f-sub">已結束工作 ・ 尚未填寫評論</span>
      <div class="f-spacer"></div>
      <span class="badge gold">${pending.length} 筆待處理</span>
    </div>`;

  if (!pending.length) {
    el.innerHTML = `<div class="sticky-wrap">${demoBannerHtml()}${headerBar}</div>` + empty('ok','全部清空','目前沒有待評論的工作單');
    syncTheadOffset(el);
    return;
  }

  const checkedCnt=pending.filter(p=>st.reviewChecked.has(p._key)).length;
  const allRevChk=checkedCnt===pending.length && pending.length>0;

  const tbodies = groups.map((g, gi) => {
    const sub = g.company!==g.branch ? `<span class="grp-sub">${esc(g.company)}</span>` : '';
    const groupKeys = g.rows.map(p => p._key);
    const grpChecked = groupKeys.filter(k => st.reviewChecked.has(k)).length;
    const grpAllChk = groupKeys.length>0 && grpChecked===groupKeys.length;
    const dataRows = g.rows.map(p => {
      const i = pending.indexOf(p);
      const adjLabels = adjustLabels(p.adjust);
      const adjustHtml = adjLabels.length
        ? adjLabels.map(l => `<span class="chip pink">${esc(l)}</span>`).join('<br>')
        : '<span class="chip gray">無</span>';
      const shiftHtml = (p.startTime && p.endTime)
        ? `<span style="color:var(--t2)">${esc(p.startTime)}</span><span style="color:var(--t3);padding:0 6px">~</span><span style="color:var(--t2)">${esc(p.endTime)}</span>`
        : '<span class="chip gray">無</span>';
      const ckHtml = hasPunchCols
        ? clockStatusHtml(clockStatus(p.startTime, p.endTime, p.actualIn, p.actualOut))
        : '<span class="chip gray">無打卡資料</span>';
      return `<tr>
        <td class="chk-td"><input type="checkbox" ${st.reviewChecked.has(p._key)?'checked':''} onchange="toggleReviewCheck(${i})"></td>
        <td style="color:var(--t1);font-weight:500">${esc(p.worker)}</td>
        <td>${esc(p.workDate)}</td>
        <td><span class="mono">${esc(p.orderNum||'—')}</span></td>
        <td style="line-height:1.7">${adjustHtml}</td>
        <td style="white-space:nowrap">${shiftHtml}</td>
        <td>${ckHtml}</td>
      </tr>`;
    }).join('');
    return `<tbody>
      <tr class="grp-head">
        <td class="chk-td"><input type="checkbox" data-rgi="${gi}" ${grpAllChk?'checked':''} onchange="checkAllReviewGroup(${gi},this.checked)"></td>
        <td colspan="6"><div class="grp-title-row">
          <span class="grp-title">${esc(g.branch||g.company)}</span>${sub}
          <span class="badge">${g.rows.length} 筆</span>
        </div></td>
      </tr>
      ${dataRows}
    </tbody>`;
  }).join('');

  el.innerHTML = `
    <div class="sticky-wrap">
      ${demoBannerHtml()}
      ${headerBar}
    </div>
    <div class="card">
      <div class="table-well" style="margin:14px">
        <div class="table-scroll">
          <table class="tbl">
            <thead><tr>
              <th class="chk-th"></th>
              <th>打工者</th><th>上工日期</th><th>工單號碼</th><th>調整申請</th><th>排班時段</th><th>打卡資訊</th>
            </tr></thead>
            ${tbodies}
          </table>
        </div>
      </div>
    </div>`;

  syncTheadOffset(el);

  document.querySelectorAll('[data-rgi]').forEach(cb => {
    const gi=parseInt(cb.dataset.rgi), g=st._reviewGroups[gi]; if(!g) return;
    const keys=g.rows.map(p=>p._key), cnt=keys.filter(k=>st.reviewChecked.has(k)).length;
    cb.indeterminate = cnt>0 && cnt<keys.length;
  });
}

function toggleReviewCheck(i) {
  const p=st._lastPending[i]; if(!p) return;
  if(st.reviewChecked.has(p._key)) st.reviewChecked.delete(p._key); else st.reviewChecked.add(p._key);
  renderReviews();
}
function checkAllReviewGroup(gi, isChecked) {
  const g=st._reviewGroups[gi]; if(!g) return;
  g.rows.forEach(p => { if(isChecked) st.reviewChecked.add(p._key); else st.reviewChecked.delete(p._key); });
  renderReviews();
}
function checkAllReviews(isChecked) {
  st._lastPending.forEach(p => { if(isChecked) st.reviewChecked.add(p._key); else st.reviewChecked.delete(p._key); });
  renderReviews();
}

/* ═══════════════════════════════════════════════════════════════════════════
   Cancel tracking pane
   ─────────────────────────────────────────────────────────────────────────── */
function renderCancel() {
  const el = document.getElementById('pane-cancel');
  if (!st.merchants.length) { el.innerHTML = empty('cog', '尚未設定店鋪', '請先上傳店鋪設定資料'); return; }
  if (!st.apps.length)      { el.innerHTML = empty('folder', '尚未匯入申請', '請上傳工作申請資料'); return; }

  // 欄位偵測
  const sample = st.apps[0];
  const colKey = k => Object.keys(sample).find(h => h.includes(k)) || '';
  const orderNumCol   = colKey('工單編號') || colKey('工單號碼') || colKey('工作單號碼') || colKey('工作編號');
  const loginCol      = colKey('登入帳號');
  const nameCol       = colKey('打工者姓名') || colKey('打工夥伴姓名') || colKey('姓名');
  const workTimeCol   = colKey('工作時間');
  const cancelTimeCol = Object.keys(sample).find(h => h.trim() === '打工夥伴取消') || colKey('取消時間');
  const agreeTimeCol  = Object.keys(sample).find(h => h.trim() === '商家同意') || colKey('商家同意時間');

  // 日期篩選
  let cancelled = st.apps.filter(a => a._mine && str(a['狀態']).trim() === '打工夥伴取消');
  if (st.fc.from) cancelled = cancelled.filter(a => a._workDate >= st.fc.from);
  if (st.fc.to)   cancelled = cancelled.filter(a => a._workDate <= st.fc.to);
  cancelled.sort((a, b) => a._workDate.localeCompare(b._workDate));

  // 工單號碼 → 最新「商家同意」時間 Map
  const reMatchMap = new Map();
  st.apps.forEach(a => {
    if (str(a['狀態']).trim() !== '商家同意') return;
    const wn = str(a[orderNumCol] || '');
    const t  = str(a[agreeTimeCol] || '');
    if (!wn) return;
    if (!reMatchMap.has(wn) || t > reMatchMap.get(wn)) reMatchMap.set(wn, t);
  });

  // 依店鋪分組
  const groupMap = new Map();
  cancelled.forEach(a => {
    const key = a._company + '|||' + a._branch;
    if (!groupMap.has(key)) groupMap.set(key, { company: a._company, branch: a._branch, rows: [] });
    groupMap.get(key).rows.push(a);
  });
  st._cancelGroups = [...groupMap.values()].sort((a, b) => {
    const cmp = a.company.localeCompare(b.company, 'zh-Hant');
    return cmp !== 0 ? cmp : (a.branch || a.company).localeCompare(b.branch || b.company, 'zh-Hant');
  });
  const groups = st._cancelGroups;

  const filterBar = `
    <div class="filter-bar">
      <span class="f-label">工作日期</span>
      <button type="button" class="date-trigger ${st.fc.from?'':'date-empty'}" style="width:136px" onclick="datePicker.open(this, 'from', 'fc')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>${st.fc.from ? esc(st.fc.from.replace(/-/g,' / ')) : '開始日期'}</span>
      </button>
      <span class="f-range-sep">→</span>
      <button type="button" class="date-trigger ${st.fc.to?'':'date-empty'}" style="width:136px" onclick="datePicker.open(this, 'to', 'fc')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>${st.fc.to ? esc(st.fc.to.replace(/-/g,' / ')) : '結束日期'}</span>
      </button>
      <span class="f-summary">共 <b>${cancelled.length}</b> 筆 ／ <b>${groups.length}</b> 個店鋪</span>
    </div>`;

  let content;
  if (!cancelled.length) {
    content = empty('check', '目前無取消紀錄', groups.length === 0 && (st.fc.from||st.fc.to) ? '請調整日期範圍' : '沒有屬於您商家的取消工作紀錄');
  } else {
    const tbodies = groups.map((g, gi) => {
      const sub = g.company !== g.branch ? `<span class="grp-sub">${esc(g.company)}</span>` : '';
      const ids = g.rows.map(a => a._id);
      const cnt = ids.filter(id => st.cancelChecked.has(id)).length;
      const allChk = ids.length > 0 && cnt === ids.length;
      const dataRows = g.rows.map((a, ri) => {
        const wn         = str(a[orderNumCol] || '');
        const login      = cleanId(str(a[loginCol] || ''));
        const name       = str(a[nameCol] || '-');
        const workTime   = str(a[workTimeCol] || '-');
        const cancelTime = str(a[cancelTimeCol] || '-');
        const reMatchTime = reMatchMap.get(wn);
        const isReMatched = reMatchTime && cancelTime && cancelTime !== '-' && reMatchTime > cancelTime;
        const reMatchChip = isReMatched
          ? '<span class="chip green chip-fixed">Yes</span>'
          : '<span class="chip gray chip-fixed">No</span>';
        return `<tr>
          <td class="chk-td"><input type="checkbox" ${st.cancelChecked.has(a._id)?'checked':''} onchange="toggleCancelCheck(${gi},${ri})"></td>
          <td><span class="mono">${esc(login)}</span></td>
          <td style="color:var(--t1);font-weight:500">${esc(name)}</td>
          <td style="color:var(--t2)">${esc(workTime)}</td>
          <td style="color:var(--t2)">${esc(cancelTime)}</td>
          <td>${reMatchChip}</td>
        </tr>`;
      }).join('');
      return `<tbody>
        <tr class="grp-head">
          <td class="chk-td"><input type="checkbox" data-cgi="${gi}" ${allChk?'checked':''} onchange="checkAllCancelGroup(${gi},this.checked)"></td>
          <td colspan="5"><div class="grp-title-row">
            <span class="grp-title">${esc(g.branch || g.company)}</span>${sub}
            <span class="badge">${g.rows.length} 筆</span>
          </div></td>
        </tr>
        ${dataRows}
      </tbody>`;
    }).join('');

    content = `<div class="card">
      <div class="table-well" style="margin:14px">
        <div class="table-scroll">
          <table class="tbl">
            <thead><tr>
              <th class="chk-th"></th>
              <th>登入帳號</th><th>打工者</th><th>工作時間</th><th>取消時間</th><th>已重新媒合</th>
            </tr></thead>
            ${tbodies}
          </table>
        </div>
      </div>
    </div>`;
  }

  el.innerHTML = `
    <div class="sticky-wrap">
      ${demoBannerHtml()}
      ${filterBar}
    </div>
    ${content}`;
  syncTheadOffset(el);
  document.querySelectorAll('[data-cgi]').forEach(cb => {
    const gi = parseInt(cb.dataset.cgi), g = st._cancelGroups[gi]; if (!g) return;
    const ids = g.rows.map(a => a._id), cnt = ids.filter(id => st.cancelChecked.has(id)).length;
    cb.indeterminate = cnt > 0 && cnt < ids.length;
  });
}

// 眼睛圖示（visible=true 亮眼／false 關閉斜線眼）

    : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--t3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
}
// onclick 字串參數的安全跳脫
function jsq(s) { return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }

function toggleMerchantVisible(company, branch) {
  const k = mKey(company, branch);
  if (st.hiddenMerchants.has(k)) st.hiddenMerchants.delete(k); else st.hiddenMerchants.add(k);
  saveHiddenMerchants();
  render();
}
function toggleCompanyVisible(company) {
  const branches = st.merchants.filter(m => m.company === company);
  const allHidden = branches.every(m => st.hiddenMerchants.has(mKey(m.company, m.branch)));
  branches.forEach(m => {
    const k = mKey(m.company, m.branch);
    if (allHidden) st.hiddenMerchants.delete(k); else st.hiddenMerchants.add(k);
  });
  saveHiddenMerchants();
  render();
}
function showAllMerchants() {
  st.hiddenMerchants.clear();
  saveHiddenMerchants();
  render();
}

function renderSettings() {
  const el = document.getElementById('pane-settings');

  if (!st.merchants.length) {
    el.innerHTML = empty('cog','尚未載入店鋪','請上傳店鋪設定資料');
    return;
  }

  // group by company
  const groupMap = new Map();
  st.merchants.forEach(m => {
    if (!groupMap.has(m.company)) groupMap.set(m.company, []);
    groupMap.get(m.company).push(m);
  });

  // 分店內排序：有班表優先(tier 0) → 分店名（brand 欄位現作備註自由填寫用，不參與排序）
  groupMap.forEach(branches => {
    branches.sort((a, b) => {
      const ta = a.hasSched ? 0 : 1, tb = b.hasSched ? 0 : 1;
      if (ta !== tb) return ta - tb;
      return a.branch < b.branch ? -1 : a.branch > b.branch ? 1 : 0;
    });
  });

  // 公司層級排序：有任何分店有班表(tier 0) → 全部無班表(tier 1)；同層按中文
  const groups = [...groupMap.entries()].sort((a, b) => {
    const ta = a[1].some(m => m.hasSched) ? 0 : 1;
    const tb = b[1].some(m => m.hasSched) ? 0 : 1;
    if (ta !== tb) return ta - tb;
    return a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0;
  });

  const fmtChip = (fmt) => {
    if (!fmt) return '<span class="chip gray chip-fixed">No</span>';
    const f = String(fmt).toLowerCase().trim();
    if (fmt.includes('行事曆') || f.includes('type 1') || f === 'type1' || f === '1')
      return '<span class="chip sky chip-fixed">Type 1</span>';
    if (fmt.includes('表格') || f.includes('type 2') || f === 'type2' || f === '2')
      return '<span class="chip lilac chip-fixed">Type 2</span>';
    return `<span class="chip gray chip-fixed">${esc(fmt)}</span>`;
  };

  const hiddenTotal = st.merchants.filter(m => st.hiddenMerchants.has(mKey(m.company, m.branch))).length;

  const tbodies = groups.map(([company, branches]) => {
    const dataRows = branches.map(m => {
      const hidden = st.hiddenMerchants.has(mKey(m.company, m.branch));
      return `<tr style="${hidden?'opacity:.42':''}">
      <td style="text-align:center;cursor:pointer;width:56px" title="${hidden?'已隱藏，點擊顯示':'顯示中，點擊隱藏'}" onclick="toggleMerchantVisible('${jsq(m.company)}','${jsq(m.branch)}')">${eyeIcon(!hidden)}</td>
      <td style="font-weight:600;color:var(--t1);${hidden?'text-decoration:line-through':''}">${esc(m.branch)}</td>
      <td><span class="chip ${m.hasSched?'green':'gray'} chip-fixed">${m.hasSched?'Yes':'No'}</span></td>
      <td>${fmtChip(m.fmt)}</td>
      <td style="color:var(--t2);max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(m.brand||'')}">${esc(m.brand||'')}</td>
    </tr>`;
    }).join('');
    const hiddenCnt = branches.filter(m => st.hiddenMerchants.has(mKey(m.company, m.branch))).length;
    const allHidden = hiddenCnt === branches.length && branches.length > 0;
    return `<tbody>
      <tr class="grp-head">
        <td colspan="5"><div class="grp-title-row">
          <span title="${allHidden?'整間已隱藏，點擊全部顯示':'點擊隱藏整間公司'}" style="cursor:pointer;display:inline-flex;align-items:center" onclick="toggleCompanyVisible('${jsq(company)}')">${eyeIcon(!allHidden)}</span>
          <span class="grp-title">${esc(company)}</span>
          <span class="badge">${branches.length} 間</span>
          ${hiddenCnt?`<span class="badge gray">已隱藏 ${hiddenCnt}</span>`:''}
        </div></td>
      </tr>
      <tr>
        <th style="width:56px;text-align:center">顯示</th><th style="width:280px">分店名稱</th><th style="width:200px">雲端班表</th><th style="width:200px">班表格式</th><th>備註</th>
      </tr>
      ${dataRows}
    </tbody>`;
  }).join('');

  el.innerHTML = `
    <div class="sticky-wrap">
      ${demoBannerHtml()}
      <div class="filter-bar">
        <span class="f-title">店鋪設定</span>
        <span class="f-sub">${st.merchants.length} 間店鋪 ・ ${groups.length} 家公司${hiddenTotal?` ・ <span style="color:var(--gold)">已隱藏 ${hiddenTotal} 間</span>`:''}</span>
        <div class="f-spacer"></div>
        <div class="f-actions">
          ${hiddenTotal?`<button class="btn compact" onclick="showAllMerchants()">全部顯示</button>`:''}
          <button class="btn compact" onclick="exportMerchantsXLSX()">匯出 Excel</button>
          <button class="btn compact danger" onclick="clearMerchants()">清除設定</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="table-well" style="margin:14px">
        <div class="table-scroll">
          <table class="tbl">${tbodies}</table>
        </div>
      </div>
    </div>`;
}

function exportMerchantsXLSX() {
  if (!st.merchants.length) return;
  const rows = [['店鋪名稱', '分店', '雲端班表', 'Excel連結', '工作表關鍵字', '班表格式']];
  st.merchants.forEach(m => {
    rows.push([m.company, m.branch===m.company ? '' : m.branch, m.hasSched ? '是' : '否', m.url||'', m.keyword||'', m.fmt||'']);
  });
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '店鋪設定');
  XLSX.writeFile(wb, 'Worky 商家設定表.xlsx');
}

function showConfirm({ title, body, okLabel = '確定', onOk }) {
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.innerHTML = `
    <div class="modal-box">
      <div class="modal-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <circle cx="12" cy="17" r="0.5" fill="currentColor"/>
        </svg>
      </div>
      <div class="modal-title">${esc(title)}</div>
      <div class="modal-body">${body}</div>
      <div class="modal-actions">
        <button class="btn" id="_mc_cancel">取消</button>
        <button class="btn primary danger" id="_mc_ok">${esc(okLabel)}</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.querySelector('#_mc_cancel').onclick = close;
  ov.querySelector('#_mc_ok').onclick = () => { close(); onOk(); };
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  document.addEventListener('keydown', function esc(e) {
    if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc); }
  });
}

function clearMerchants() {
  showConfirm({
    title: '清除店鋪設定',
    body: '確定要清除所有店鋪設定嗎？<br>清除後，下次使用前需重新上傳設定表。',
    okLabel: '確定清除',
    onOk: () => { st.merchants = []; localStorage.removeItem(STORAGE_KEY); setDot('cfg', false, '未載入'); render(); }
  });
}

  error: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`,

function showAlert({ title, body, tone = 'info', okLabel = '我知道了' }) {
  return new Promise(resolve => {
    const ov = document.createElement('div');
    ov.className = 'modal-overlay';
    ov.innerHTML = `
      <div class="modal-box">
        <div class="modal-icon ${tone}">${ALERT_ICONS[tone] || ALERT_ICONS.info}</div>
        <div class="modal-title">${esc(title)}</div>
        ${body ? `<div class="modal-body">${body}</div>` : ''}
        <div class="modal-actions">
          <button class="btn primary" id="_ma_ok">${esc(okLabel)}</button>
        </div>
      </div>`;
    document.body.appendChild(ov);
    const close = () => { ov.remove(); resolve(); };
    ov.querySelector('#_ma_ok').onclick = close;
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.addEventListener('keydown', function esc(e) {
      if (e.key === 'Escape' || e.key === 'Enter') { close(); document.removeEventListener('keydown', esc); }
    });
  });
}

/* ─────────────────────────────────────────────────────────────────────────
   Custom date picker
   ───────────────────────────────────────────────────────────────────────── */
const datePicker = {
  el: null, viewMonth: null, bindKey: null, triggerEl: null, _outsideHandler: null, _stateKey: 'f',

  open(triggerEl, bindKey, stateKey) {
    if (this.el && this.triggerEl === triggerEl) { this.close(); return; }
    this.close();
    this.bindKey = bindKey;
    this.triggerEl = triggerEl;
    this._stateKey = stateKey || 'f';
    const v = this._stateKey === 'cf'
      ? ((() => { const l = _cfLoad(); return l[st._cfSel] ? l[st._cfSel][bindKey] : ''; })())
      : st[this._stateKey][bindKey];
    this.viewMonth = v ? new Date(v + 'T00:00:00') : new Date();
    this.viewMonth.setDate(1);

    triggerEl.classList.remove('date-empty');
    triggerEl.classList.add('active');
    this.el = document.createElement('div');
    this.el.className = 'date-popover';
    document.body.appendChild(this.el);
    this.render();
    this.position();

    setTimeout(() => {
      this._outsideHandler = (e) => {
        if (!this.el?.contains(e.target) && !this.triggerEl?.contains(e.target)) this.close();
      };
      document.addEventListener('click', this._outsideHandler);
    }, 0);
  },
  close() {
    if (this.el) { this.el.remove(); this.el = null; }
    if (this.triggerEl) { this.triggerEl.classList.remove('active'); this.triggerEl = null; }
    if (this._outsideHandler) { document.removeEventListener('click', this._outsideHandler); this._outsideHandler = null; }
  },
  position() {
    if (!this.el || !this.triggerEl) return;
    const r = this.triggerEl.getBoundingClientRect();
    const popH = 320, popW = 280;
    let top = r.bottom + 8;
    let left = r.left;
    if (top + popH > window.innerHeight - 12) top = r.top - popH - 8;
    if (left + popW > window.innerWidth - 12) left = window.innerWidth - popW - 12;
    if (left < 12) left = 12;
    this.el.style.top = top + 'px';
    this.el.style.left = left + 'px';
  },
  changeMonth(delta) { this.viewMonth.setMonth(this.viewMonth.getMonth() + delta); this.render(); },
  pick(iso) {
    if (this._stateKey === 'cf') {
      // 確認書日期：直接寫回 localStorage
      _cfUpdField(this.bindKey, iso);
      this.close();
      renderConfirm();
      return;
    }
    st[this._stateKey][this.bindKey] = iso;
    this.close();
    render();
  },
  isoOf(date) {
    return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
  },
  render() {
    const m = this.viewMonth;
    const year = m.getFullYear(), month = m.getMonth();
    const firstDow = new Date(year, month, 1).getDay();
    const lastDay = new Date(year, month+1, 0).getDate();
    const today = new Date(); today.setHours(0,0,0,0);
    const selected = this._stateKey === 'cf'
      ? ((() => { const l = _cfLoad(); return l[st._cfSel] ? l[st._cfSel][this.bindKey] : ''; })())
      : st[this._stateKey][this.bindKey];

    const cells = [];
    for (let i=0; i<firstDow; i++) cells.push('<div class="date-cell empty"></div>');
    for (let d=1; d<=lastDay; d++) {
      const dt = new Date(year, month, d);
      const iso = this.isoOf(dt);
      let cls = 'date-cell';
      if (iso === selected) cls += ' selected';
      if (dt.getTime() === today.getTime()) cls += ' today';
      cells.push(`<button class="${cls}" onclick="datePicker.pick('${iso}')">${d}</button>`);
    }

    this.el.innerHTML = `
      <div class="date-popover-head">
        <button class="date-nav" onclick="event.stopPropagation(); datePicker.changeMonth(-1)" title="上個月">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <span class="date-month">${year} 年 ${month+1} 月</span>
        <button class="date-nav" onclick="event.stopPropagation(); datePicker.changeMonth(1)" title="下個月">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
      <div class="date-dow">${['日','一','二','三','四','五','六'].map(d => `<div>${d}</div>`).join('')}</div>
      <div class="date-grid">${cells.join('')}</div>
      <div class="date-popover-foot">
        <button class="btn" onclick="datePicker.pick('')">清除</button>
        <button class="btn primary" onclick="datePicker.pick('${this.isoOf(new Date())}')">今天</button>
      </div>`;
  }
};
window.datePicker = datePicker;
window.addEventListener('resize', () => datePicker.position());

/* ═══════════════════════════════════════════════════════════════════════════
   Tweaks
   ─────────────────────────────────────────────────────────────────────────── */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "magenta",
  "depth": "med",
  "radius": "pillow",
  "density": "default"
}/*EDITMODE-END*/;

const accentMap = {
  honey:   { rgb:'244,197,118', top:'#6b5018', bot:'#2e2008', topHi:'#8a651f' },
  mint:    { rgb:'94,224,200',  top:'#206a5e', bot:'#0c2a26', topHi:'#2a8074' },
  lilac:   { rgb:'183,148,255', top:'#4a3592', bot:'#1f1450', topHi:'#5d44b3' },
  magenta: { rgb:'244,114,182', top:'#7a2660', bot:'#3a1130', topHi:'#a02c7a' },
};

let tweakState = { ...TWEAK_DEFAULTS };

function applyTweaks() {
  // accent
  const a = accentMap[tweakState.accent] || accentMap.magenta;
  const root = document.documentElement;
  root.style.setProperty('--accent-rgb', a.rgb);
  root.style.setProperty('--accent-top', a.top);
  root.style.setProperty('--accent-bot', a.bot);
  root.style.setProperty('--accent-top-hi', a.topHi);
  // depth + radius
  root.setAttribute('data-depth', tweakState.depth);
  root.setAttribute('data-radius', tweakState.radius);
  // density (CSS variable controls padding scale)
  root.setAttribute('data-density', tweakState.density);

  // active state in UI
  document.querySelectorAll('#accent-swatches .swatch').forEach(s => s.classList.toggle('active', s.dataset.v===tweakState.accent));
  document.querySelectorAll('#depth-seg .seg').forEach(s => s.classList.toggle('active', s.dataset.v===tweakState.depth));
  document.querySelectorAll('#radius-seg .seg').forEach(s => s.classList.toggle('active', s.dataset.v===tweakState.radius));
  document.querySelectorAll('#density-seg .seg').forEach(s => s.classList.toggle('active', s.dataset.v===tweakState.density));
}

function initTweaks() {
  // accent swatches
  const swEl = document.getElementById('accent-swatches');
  Object.entries(accentMap).forEach(([k, v]) => {
    const btn = document.createElement('button');
    btn.className = 'swatch';
    btn.dataset.v = k;
    btn.style.background = `radial-gradient(circle at 35% 30%, rgb(${v.rgb}), ${v.top} 70%, ${v.bot})`;
    btn.style.color = `rgb(${v.rgb})`;
    btn.title = ({honey:'蜂蜜金', mint:'薄荷青', lilac:'紫丁香', magenta:'桃紅'})[k] || k;
    btn.onclick = () => { setTweak('accent', k); };
    swEl.appendChild(btn);
  });
  // seg controls
  document.querySelectorAll('#depth-seg .seg, #radius-seg .seg, #density-seg .seg').forEach(b => {
    b.onclick = () => {
      const key = b.parentElement.id.replace('-seg','');
      setTweak(key, b.dataset.v);
    };
  });
  applyTweaks();

  // edit-mode protocol
  window.addEventListener('message', e => {
    const d = e.data || {};
    if (d.type === '__activate_edit_mode')   openTweaks();
    if (d.type === '__deactivate_edit_mode') closeTweaks();
  });
  try { window.parent.postMessage({type:'__edit_mode_available'}, '*'); } catch {}
}

function setTweak(key, value) {
  tweakState[key] = value;
  applyTweaks();
  try {
    const edits = {}; edits[key] = value;
    window.parent.postMessage({type:'__edit_mode_set_keys', edits}, '*');
  } catch {}
}

function toggleTweaks() {
  const tw = document.getElementById('tweaks');
  if (tw.classList.contains('open')) closeTweaks(); else openTweaks();
}

// Phase 2 — Microsoft Graph API 驗證（PKCE popup 流程）
// ═══════════════════════════════════════════════════════════════

const MS_CLIENT_ID = 'a4bcea35-fc2c-4ef1-ab4a-b85cc209ec34';
const MS_TENANT_ID = '80ee6094-c90a-47bb-aee1-57f81d9af1f9';
const MS_SCOPES    = ['Files.ReadWrite', 'Files.ReadWrite.All', 'User.Read'];

let msalInstance  = null;
let msAccessToken = null;
let msAccount     = null;

function msIsLocalFile() {
  return location.protocol === 'file:' || location.hostname === '';
}

async function initMsal() {
  if (msIsLocalFile()) { updateMsUI(); return; }
  if (typeof msal === 'undefined') {
    window._msalInitError = 'MSAL 函式庫未載入';
    updateMsUI();
    return;
  }
  try {
    const config = {
      auth: {
        clientId:    MS_CLIENT_ID,
        authority:   `https://login.microsoftonline.com/${MS_TENANT_ID}`,
        redirectUri: window.location.href.split('?')[0].split('#')[0],
      },
      cache: {
        cacheLocation:          'localStorage',
        storeAuthStateInCookie: false,
      }
    };
    msalInstance = new msal.PublicClientApplication(config);
    const accounts = msalInstance.getAllAccounts();
    if (accounts.length > 0) {
      msAccount = accounts[0];
      await msAcquireTokenSilent();
    }
  } catch (e) {
    window._msalInitError = e.message || String(e);
    console.error('MSAL 初始化失敗：', e);
    msalInstance = null;
  }
  updateMsUI();
}

async function msLogin() {
  if (msIsLocalFile()) {
    showAlert({ title: '需透過網頁使用', body: 'Microsoft 登入需透過 GitHub Pages 開啟才能使用。', tone: 'info' });
    return;
  }
  if (!msalInstance) {
    const hint = window._msalInitError ? `<br><br>錯誤：${esc(window._msalInitError)}` : '';
    showAlert({ title: 'Microsoft 驗證未初始化', body: '請重新整理頁面後再試。' + hint, tone: 'error' });
    return;
  }
  try {
    const result  = await msalInstance.loginPopup({ scopes: MS_SCOPES });
    msAccount     = result.account;
    msAccessToken = result.accessToken;
    updateMsUI();
  } catch (e) {
    if (e.name !== 'BrowserAuthError' || !e.message.includes('user_cancelled')) {
      showAlert({ title: '登入失敗', body: esc(String(e.message || e)), tone: 'error' });
    }
  }
}

async function msLogout() {
  if (!msalInstance) return;
  try {
    await msalInstance.logoutPopup({ account: msAccount });
  } catch {}
  msAccount     = null;
  msAccessToken = null;
  updateMsUI();
}

async function msAcquireTokenSilent() {
  try {
    const result  = await msalInstance.acquireTokenSilent({ scopes: MS_SCOPES, account: msAccount });
    msAccessToken = result.accessToken;
  } catch (e) {
    if (e.name === 'InteractionRequiredAuthError') {
      try {
        const result  = await msalInstance.acquireTokenPopup({ scopes: MS_SCOPES, account: msAccount });
        msAccessToken = result.accessToken;
      } catch {}
    }
  }
}

function updateMsUI() {
  const notIn   = document.getElementById('ms-not-logged-in');
  const inEl    = document.getElementById('ms-logged-in');
  const nameEl  = document.getElementById('ms-user-name');
  const avatarEl= document.getElementById('ms-avatar');
  if (msAccount) {
    notIn.hidden  = true;
    inEl.hidden   = false;
    const name    = msAccount.name || msAccount.username || '使用者';
    if (nameEl) nameEl.textContent = name;
    if (avatarEl) {
      avatarEl.firstChild.textContent = name.charAt(0).toUpperCase();
      avatarEl.title = 'Microsoft：' + name;
    }
  } else {
    notIn.hidden = false;
    inEl.hidden  = true;
  }
}

document.addEventListener('DOMContentLoaded', initMsal);
function openTweaks() {
  document.getElementById('tweaks').classList.add('open');
  document.getElementById('tweaks-trigger').style.display = 'none';
}
function closeTweaks() {
  document.getElementById('tweaks').classList.remove('open');
  document.getElementById('tweaks-trigger').style.display = '';
  try { window.parent.postMessage({type:'__edit_mode_dismissed'}, '*'); } catch {}
}



/* ══════════════════════════════════════════
   確認書 Tab — confirm (v2)
══════════════════════════════════════════ */
var CONFIRM_KEY = 'worky_confirm_v2';

var _cfTimesCleared = false;
function _cfLoad() {
  try {
    var list = JSON.parse(localStorage.getItem(CONFIRM_KEY) || '[]');
    if (!_cfTimesCleared) {
      var today = new Date().toISOString().slice(0, 10);
      list.forEach(function(item) {
        item.origStart = ''; item.origEnd = '';
        item.adjStart  = ''; item.adjEnd  = '';
        item.signDate  = today;
      });
      _cfTimesCleared = true;
    }
    return list;
  } catch(e) { return []; }
}
function _cfSave(list) {
  try { localStorage.setItem(CONFIRM_KEY, JSON.stringify(list)); }
  catch(e) { showAlert({ title: '儲存空間不足', body: '請刪除部分確認書或縮小附件圖片。', tone: 'warning' }); }
}
function _cfNewItem() {
  var today = new Date().toISOString().slice(0, 10);
  return {
    id: Date.now(),
    legalName: '', storeDisplay: '', address: '',
    workerName: '', hourly: '', insurance: '',
    signDate: today,
    origDate: today, origStart: '', origEnd: '', origBreak: '0',
    adjStart: '', adjEnd: '', adjBreak: '0',
    isHoliday: false, attachments: []
  };
}

/* ── 時間解析 ── */
function _cfParseTime(s) {
  s = (s || '').trim().replace(/[^0-9:]/g, '');
  var h, m;
  if (s.indexOf(':') >= 0) {
    var p = s.split(':');
    h = parseInt(p[0]) || 0;
    m = parseInt(p[1]) || 0;
  } else {
    var pad = s.padStart(4, '0');
    h = parseInt(pad.slice(0, 2)) || 0;
    m = parseInt(pad.slice(2)) || 0;
  }
  h = Math.min(h, 23); m = Math.min(m, 59);
  return h * 60 + m;
}
function _cfFmtTime(mins) {
  var h = Math.floor(mins / 60) % 24;
  var m = mins % 60;
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}
function cfNormTime(el) {
  if (!el.value.trim()) return;
  el.value = _cfFmtTime(_cfParseTime(el.value));
  cfUpdInp(el);
}
function cfFocusNext(el) {
  var all = Array.from(document.querySelectorAll('.cf-input'));
  var i = all.indexOf(el);
  if (i >= 0 && i < all.length - 1) all[i + 1].focus();
}
function cfTimeInput(el) {
  var digits = el.value.replace(/\D/g, '');
  if (digits.length >= 4) {
    digits = digits.slice(0, 4);
    el.value = digits.slice(0, 2) + ':' + digits.slice(2, 4);
    cfUpdInp(el);
    cfFocusNext(el);
  }
}

/* ── 淨工時計算（支援跨日） ── */
function _cfNetMins(start, end, breakMins) {
  if (!(start || '').trim() || !(end || '').trim()) return 0;
  var s = _cfParseTime(start);
  var e = _cfParseTime(end);
  var tot = e - s;
  if (tot <= 0) tot += 24 * 60;   // 跨日
  return Math.max(0, tot - (parseFloat(breakMins) || 0));
}

/* ── 薪資計算 ── */
function _cfCalc(item) {
  var hourly = parseFloat(item.hourly) || 0;
  var insur  = parseFloat(item.insurance) || 0;
  var net    = _cfNetMins(item.adjStart, item.adjEnd, item.adjBreak);
  var rate   = hourly / 60;
  var norm   = Math.min(net, 480);
  var ot1    = Math.min(Math.max(net - 480, 0), 120);
  var ot2    = Math.min(Math.max(net - 600, 0), 120);
  var base   = norm * rate;
  var ot1p   = ot1 * rate * 1.34;
  var ot2p   = ot2 * rate * 1.67;
  var holi   = item.isHoliday ? norm * rate : 0;
  var final  = Math.ceil(base + ot1p + ot2p + holi - insur);
  return { base: base, ot1p: ot1p, ot2p: ot2p, holi: holi, insur: insur, final: final, net: net, hourly: hourly };
}

/* ── 輔助 ── */
function _cfRoc(iso) {
  if (!iso) return { y: '', m: '', d: '' };
  var p = iso.split('-');
  return { y: String(parseInt(p[0]) - 1911), m: String(parseInt(p[1])), d: String(parseInt(p[2])) };
}
function _cfFmtH(m) {
  if (!m) return '0H';
  return m % 60 === 0 ? (m / 60) + 'H' : (m / 60).toFixed(1) + 'H';
}
function _cfFmtMoney(n) { return Math.round(n).toLocaleString(); }
function _cfDisplayStore(item) {
  return item.storeDisplay || item.branch || item.legalName || '—';
}

/* ── 薪資簡述 ── */
function _cfSummaryText(item) {
  var s = _cfCalc(item);
  var roc = _cfRoc(item.origDate);
  var dateStr = roc.y ? roc.y + '年' + roc.m + '月' + roc.d + '日' : '—';
  var insur = parseFloat(item.insurance) || 0;
  var h = parseFloat(item.hourly) || 0;
  var storeName = _cfDisplayStore(item);
  var norm = Math.min(s.net, 480);
  var ot1 = Math.min(Math.max(s.net - 480, 0), 120);
  var ot2 = Math.min(Math.max(s.net - 600, 0), 120);
  var holi = item.isHoliday ? norm : 0;
  var parts = [];
  if (norm > 0) parts.push(_cfFmtH(norm) + ' × ' + h);
  if (holi > 0) parts.push(_cfFmtH(holi) + ' × ' + h + '（假日加給）');
  if (ot1 > 0)  parts.push(_cfFmtH(ot1) + ' × ' + h + ' × 1.34');
  if (ot2 > 0)  parts.push(_cfFmtH(ot2) + ' × ' + h + ' × 1.67');
  var expr = parts.join(' + ') || '—';
  if (insur > 0) expr += ' − ' + insur;
  var timeNote = (item.adjStart || item.adjEnd)
    ? '（調整後 ' + (item.adjStart || '—') + '-' + (item.adjEnd || '—') + '，休息' + (parseFloat(item.adjBreak) || 0) + '分鐘）'
    : '';
  return storeName + '：' + dateStr + ' ' + expr + ' = ' + (s.final > 0 ? s.final.toLocaleString() : '—') + ' 元' + timeNote;
}

/* ── 商家資料 ── */
function _cfLegals() {
  var seen = {};
  (st.merchants || []).forEach(function(m) { var k = m.legalName || m.company; if (k) seen[k] = 1; });
  return Object.keys(seen).sort();
}
function _cfStoreOptions(legalName) {
  var seen = {};
  (st.merchants || []).forEach(function(m) {
    var k = m.legalName || m.company;
    if (legalName && k !== legalName) return;
    var disp = m.branch || m.company;
    if (disp) seen[disp] = 1;
  });
  return Object.keys(seen).sort();
}

/* ── HTML 建構輔助 ── */
function _cfInput(field, type, placeholder, val, extra) {
  return '<input class="cf-input" type="' + type + '" placeholder="' + placeholder + '" value="' + esc(val || '') + '" data-field="' + field + '" oninput="cfUpdInp(this)"' + (extra ? ' ' + extra : '') + '>';
}
function _cfTimeInput(field, val) {
  return '<input class="cf-input cf-time-inp" type="text" placeholder="HHMM" value="' + esc(val || '') + '" data-field="' + field + '" oninput="cfTimeInput(this)" onblur="cfNormTime(this)">';
}
function _cfDatalist(id, options) {
  return '<datalist id="' + id + '">' + options.map(function(o) { return '<option value="' + esc(o) + '">'; }).join('') + '</datalist>';
}

/* ── 薪資 HTML ── */
function _cfSalaryHTML(sal, overCount) {
  if (!sal) return '';
  var overLimit = sal.net > 720;
  var n = overCount || 0;
  return '<div class="cf-salary-box">'
    + (overLimit ? '<div class="cf-salary-row" style="color:var(--pink);font-weight:600;justify-content:center;">⚠ 淨工時已超過 12 小時（含加班上限）！</div>' : '')
    + '<div class="cf-salary-row"><span class="lbl">基本薪（' + _cfFmtH(Math.min(sal.net, 480)) + '）</span><span class="val">$ ' + _cfFmtMoney(sal.base) + '</span></div>'
    + (sal.ot1p > 0 ? '<div class="cf-salary-row"><span class="lbl">加班費（8–10H ×1.34）</span><span class="val">$ ' + _cfFmtMoney(sal.ot1p) + '</span></div>' : '')
    + (sal.ot2p > 0 ? '<div class="cf-salary-row"><span class="lbl">加班費（10–12H ×1.67）</span><span class="val">$ ' + _cfFmtMoney(sal.ot2p) + '</span></div>' : '')
    + (sal.holi > 0 ? '<div class="cf-salary-row"><span class="lbl">國定假日加給</span><span class="val">$ ' + _cfFmtMoney(sal.holi) + '</span></div>' : '')
    + '<div class="cf-salary-row"><span class="lbl">勞保自付額</span><span class="val">− $ ' + _cfFmtMoney(sal.insur) + '</span></div>'
    + '<div class="cf-salary-row total"><span class="lbl">最終金額</span><span class="val"> $ ' + (sal.final > 0 ? sal.final.toLocaleString() : '—') + '</span></div>'
    + '</div>';
}

/* ══════════════ renderConfirm ══════════════ */
function renderConfirm() {
  var el = document.getElementById('pane-confirm');
  var list = _cfLoad();

/* ── 事件處理 ── */
function cfNew() {
  var l = _cfLoad(); l.unshift(_cfNewItem()); _cfSave(l);
  if (!st._cfBatch) st._cfBatch = {};
  st._cfSel = 0; renderConfirm();
}
function cfSelect(i) { st._cfSel = i; renderConfirm(); }
function cfDelete(i) {
  var l = _cfLoad(); l.splice(i, 1); _cfSave(l);
  if (st._cfBatch) delete st._cfBatch[i];
  if (st._cfSel >= l.length) st._cfSel = l.length - 1;
  renderConfirm();
}
function cfToggleBatch(i) {
  if (!st._cfBatch) st._cfBatch = {};
  if (st._cfBatch[i]) delete st._cfBatch[i]; else st._cfBatch[i] = true;
}

function _cfUpdField(field, value) {
  var l = _cfLoad(); if (!l[st._cfSel]) return;
  l[st._cfSel][field] = value; _cfSave(l);
  var item = l[st._cfSel];
  /* 從 DOM 讀取時間欄位，確保即時薪資計算正確（不受 _cfLoad 清空影響） */
  ['adjStart','adjEnd','adjBreak','origStart','origEnd','origBreak'].forEach(function(f) {
    var el = document.querySelector('[data-field="' + f + '"]');
    if (el) item[f] = el.value;
  });
  /* 更新薪資 */
  var sb = document.getElementById('cf-sal-box');
  if (sb) sb.innerHTML = _cfSalaryHTML(_cfCalc(item), l.filter(function(it){ return _cfCalc(it).net > 720; }).length);
  /* 更新簡述 */
  var se = document.getElementById('cf-summary'); if (se) se.textContent = _cfSummaryText(item);
  /* 更新左側標籤 */
  var items = document.querySelectorAll('.confirm-item'); var it = items[st._cfSel];
  if (it) {
    var roc = _cfRoc(item.origDate);
    var dStr = roc.y ? roc.y + '/' + String(roc.m).padStart(2,'0') + '/' + String(roc.d).padStart(2,'0') : '—';
    var nn = it.querySelector('.confirm-item-name'); if (nn) nn.textContent = _cfDisplayStore(item) || '（未填）';
    var nd = it.querySelector('.confirm-item-date'); if (nd) nd.textContent = (item.workerName || '—') + '　' + dStr;
  }
  /* 更新 filter-bar pill 標籤（workerName / origDate 變動時即時反映） */
  var pills = document.querySelectorAll('.cf-pill');
  var pill = pills[st._cfSel];
  if (pill) {
    var roc2 = _cfRoc(item.origDate);
    var dStr2 = roc2.y ? roc2.y + '/' + String(roc2.m).padStart(2,'0') + '/' + String(roc2.d).padStart(2,'0') : '';
    var labelSpan = pill.querySelector('span:last-child');
    if (labelSpan) labelSpan.textContent = (item.workerName || '（未填）') + (dStr2 ? ' ' + dStr2 : '');
  }
  /* 法人切換 → 刷新店鋪 datalist */
  if (field === 'legalName') cfRefreshStores(value);
}
function cfUpdInp(el) { _cfUpdField(el.dataset.field, el.value); }
function cfUpdChk(el) { _cfUpdField(el.dataset.field, el.checked); }

function cfRefreshStores(legalName) {
  var dl = document.getElementById('cf-dl-store'); if (dl) {
    var opts = _cfStoreOptions(legalName);
    dl.innerHTML = opts.map(function(o) { return '<option value="' + esc(o) + '">'; }).join('');
  }

function cfComboOpen(which) {

function cfComboBlur(which) {

function cfComboFilter(which, val) {
  var allOpts = which === 'legal' ? _cfLegals() : _cfStoreOptions(document.getElementById('cf-inp-legal') ? document.getElementById('cf-inp-legal').value : '');
  var filtered = allOpts.filter(function(o){ return o.toLowerCase().indexOf(val.toLowerCase()) >= 0; });

  var inp = document.getElementById('cf-inp-' + which); if (inp) { inp.dataset.field = which === 'legal' ? 'legalName' : 'storeDisplay'; cfUpdInp(inp); }

/* ── 附件 ── */
function cfAddImgFiles(evt) {
  var files = [].slice.call(evt.target.files); if (!files.length) return;
  _cfLoadImages(files); evt.target.value = '';
}
function _cfLoadImages(files) {
  var l = _cfLoad(); if (!l[st._cfSel]) return;
  var pending = files.length;
  files.forEach(function(f) {
    if (!f.type.startsWith('image/')) { pending--; return; }
    var r = new FileReader();
    r.onload = function(e) {
      l[st._cfSel].attachments.push(e.target.result);
      if (--pending === 0) { _cfSave(l); renderConfirm(); }
    };
    r.readAsDataURL(f);
  });
}
function cfDelAttach(idx) {
  var l = _cfLoad(); if (!l[st._cfSel]) return;
  l[st._cfSel].attachments.splice(parseInt(idx), 1); _cfSave(l); renderConfirm();
}
function cfDragOver(evt) { evt.preventDefault(); evt.dataTransfer.dropEffect = 'copy'; }
function cfDrop(evt) {
  evt.preventDefault();
  var files = [].slice.call(evt.dataTransfer.files).filter(function(f) { return f.type.startsWith('image/'); });
  if (files.length) _cfLoadImages(files);
}
function _cfRegisterPaste() {
  if (window._cfPasteRegistered) return;
  window._cfPasteRegistered = true;
  document.getElementById('pane-confirm').addEventListener('keydown', function(evt) {
    if (evt.key !== 'Enter' || evt.isComposing) return;
    if (!evt.target.classList.contains('cf-input')) return;
    evt.preventDefault();
    cfFocusNext(evt.target);
  });
  document.addEventListener('paste', function(evt) {
    if (st.activeTab !== 'confirm') return;
    var items = evt.clipboardData && evt.clipboardData.items;
    if (!items) return;
    var imgs = [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].type.startsWith('image/')) {
        var blob = items[i].getAsFile();
        if (blob) imgs.push(blob);
      }
    }
    if (imgs.length) { evt.preventDefault(); _cfLoadImages(imgs); }
  });
}

/* ── 複製簡述 ── */
function cfCopy() {
  var el = document.getElementById('cf-summary'); if (!el) return;
  navigator.clipboard.writeText(el.textContent).then(function() {
    var b = el.nextElementSibling;
    if (b) { b.textContent = '已複製！'; setTimeout(function() { b.textContent = '複製'; }, 1500); }
  });
}

/* ── 產生 print 視窗 HTML ── */
function _cfBuildDoc(item, withAttach) {
  var s = _cfCalc(item);
  var ro = _cfRoc(item.origDate), rs = _cfRoc(item.signDate);
  function th(t) { var p = (t || '00:00').split(':'); return [p[0] || '00', p[1] || '00']; }
  var oS = th(item.origStart), oE = th(item.origEnd);
  var aS = th(item.adjStart), aE = th(item.adjEnd);
  function addDays(iso, days) {
    if (!iso) return iso;
    var d = new Date(iso + 'T00:00:00');
    d.setDate(d.getDate() + days);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  /* 跨日判斷：結束時間 <= 開始時間 視為隔天，回傳結束日期前綴文字（未跨日則為空字串） */
  function endDatePrefix(startRaw, endRaw) {
    var sTrim = (startRaw || '').trim(), eTrim = (endRaw || '').trim();
    if (!sTrim || !eTrim) return '';
    if (_cfParseTime(eTrim) > _cfParseTime(sTrim)) return '';
    var roEnd = _cfRoc(addDays(item.origDate, 1));
    return '民國 ' + (roEnd.y || '　') + ' 年 ' + (roEnd.m || '　') + ' 月 ' + (roEnd.d || '　') + ' 日 ';
  }
  var oEndPrefix = endDatePrefix(item.origStart, item.origEnd);
  var aEndPrefix = endDatePrefix(item.adjStart, item.adjEnd);
  var e2 = function(v) { return String(v || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
  var storeName = _cfDisplayStore(item);
  var attachHtml = '';
  if (withAttach && item.attachments && item.attachments.length) {
    var cnt = item.attachments.length;
    var cols = cnt <= 1 ? 1 : cnt <= 4 ? 2 : 3;
    var maxH = cnt <= 1 ? '240mm' : cnt <= 4 ? '115mm' : '75mm';
    var imgs = item.attachments.map(function(src) {
      return '<img src="' + src + '" style="width:100%;height:' + maxH + ';object-fit:contain;">';
    }).join('');
    attachHtml = '<div style="page-break-before:always;padding:10mm;box-sizing:border-box;display:grid;grid-template-columns:repeat(' + cols + ',1fr);gap:8px;align-items:start;">' + imgs + '</div>';
  }
  /* PDF 檔名：店鋪分店名_調整工時確認書(姓名)_西元年月日 */
  var isoDate = item.origDate ? item.origDate.replace(/-/g,'') : '';
  var title = e2(storeName) + '_調整工時確認書(' + e2(item.workerName || '') + ')_' + isoDate;
  return '<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><title>' + title + '</title>'
    + '<style>'
    + 'body{font-family:"標楷體","BiauKai","DFKai-SB","Microsoft JhengHei",serif;font-size:13pt;line-height:1.9;color:#000;margin:0}'
    + '.page{width:210mm;min-height:297mm;margin:0 auto;padding:18mm 20mm 15mm;box-sizing:border-box}'
    + 'h1{text-align:center;font-size:17pt;margin-bottom:1.2em;letter-spacing:.5em}'
    + 'p{margin:0 0 .6em;text-indent:2em;line-height:1.9}'
    + '.item{margin:0 0 .6em;line-height:1.9;padding-left:3em;text-indent:-1em}'
    + '.sig{margin-top:1.5em}'
    + '@media print{body{margin:0}@page{margin:0;size:A4}}'
    + '</style></head><body>'
    + '<div class="page">'
    + '<h1>確認書</h1>'
    + '<p>茲本公司：' + e2(item.legalName) + '（以下簡稱本公司），於沃祈數位科技股份有限公司（以下簡稱沃祈數位公司）所屬的 WORKY 人力平台（以下簡稱 WORKY）刊登招募人員工作，並與媒合成功之打工會員線下合意調整工作工時，且工作皆已執行完畢，為利 WORKY 先代本公司給付薪資事宜，故確認以下事宜：</p>'
    + '<p>一、工作內容：（時薪 ' + e2(item.hourly) + ' 元）</p>'
    + '<p class="item">1、工作地點：' + e2(storeName) + '：' + e2(item.address) + '</p>'
    + '<p class="item">2、原訂工作時間：民國 ' + (ro.y || '　') + ' 年 ' + (ro.m || '　') + ' 月 ' + (ro.d || '　') + ' 日 ' + oS[0] + ' 時 ' + oS[1] + ' 分至 ' + oEndPrefix + oE[0] + ' 時 ' + oE[1] + ' 分（休息 ' + e2(item.origBreak || '0') + ' 分鐘）。</p>'
    + '<p class="item">3、調整工作時間：民國 ' + (ro.y || '　') + ' 年 ' + (ro.m || '　') + ' 月 ' + (ro.d || '　') + ' 日 ' + aS[0] + ' 時 ' + aS[1] + ' 分至 ' + aEndPrefix + aE[0] + ' 時 ' + aE[1] + ' 分（休息 ' + e2(item.adjBreak || '0') + ' 分鐘）。</p>'
    + '<p class="item">4、工作人員名字：' + e2(item.workerName) + '</p>'
    + '<p class="item">5、應給付薪資之總實際金額（含延長工時薪資以及扣除勞保自付額）：新臺幣 ' + (s.final > 0 ? s.final.toLocaleString() : '　　') + ' 元。</p>'
    + '<p>二、本公司確認以上資訊無誤，委由沃祈數位公司依雙方所簽署的「委託人力招募合作合約書」之約定，依以上資訊先代本公司支付該工作人員薪資後，本公司再依約定期限返還沃祈數位公司相關薪資總額。</p>'
    + '<div class="sig"><p style="text-indent:0">此致 沃祈數位科技股份有限公司</p></div>'
    + '<div class="sig"><p style="text-indent:0">確認人：' + e2(item.legalName) + '</p></div>'
    + (function(){
        var lbl = 'flex:none;padding:0 4px;';
        function group(v, slots) {
          var chars = (v||'').toString().split('');
          var spans = chars.map(function(c){ return '<span style="flex:1;text-align:center;">'+c+'</span>'; }).join('');
          var w = (slots * 46) + 'px';
          return '<div style="display:flex;flex:none;width:'+w+';justify-content:space-evenly;">' + spans + '</div>';
        }
        return '<div style="text-indent:0;margin-top:2.5em;display:flex;align-items:center;justify-content:space-between;width:100%;">'
          + '<span style="'+lbl+'">民</span>'
          + '<span style="'+lbl+'">國</span>'
          + group(rs.y, 3)
          + '<span style="'+lbl+'">年</span>'
          + group(rs.m, 2)
          + '<span style="'+lbl+'">月</span>'
          + group(rs.d, 2)
          + '<span style="'+lbl+'">日</span>'
          + '</div>';
      })()
    + '</div>'
    + attachHtml
    + '</body></html>';
}

function _cfOpenPrint(item) {
  var win = window.open('', '_blank');
  if (!win) { showAlert({ title: '彈出視窗被封鎖', body: '請允許本網站的彈出視窗，或至瀏覽器設定中解除封鎖。', tone: 'warning' }); return null; }
  win.document.write(_cfBuildDoc(item, true));
  win.document.close();
  setTimeout(function() { win.print(); }, 400);
  return win;
}

/* ── 列印單份 ── */
function cfPrintOne() {
  var l = _cfLoad(); var item = l[st._cfSel]; if (!item) return;
  if (_cfCalc(item).net > 720) {
    showAlert({ title: '無法下載', body: '淨工時已超過 12 小時（含加班上限）！', tone: 'warning' });
    return;
  }
  _cfOpenPrint(item);
}

/* ── 批次下載（逐份手動觸發，避免 Chrome popup 封鎖） ── */
function cfBatchPrint() {
  var l = _cfLoad();
  var batch = st._cfBatch || {};
  var indices = Object.keys(batch).filter(function(k) { return batch[k]; }).map(Number).sort(function(a,b){return a-b;});
  if (indices.length === 0) {
    showAlert({ title: '尚未勾選', body: '請先勾選左側清單中要下載的確認書', tone: 'info' });
    return;
  }
  var blocked = indices.filter(function(i) { return l[i] && _cfCalc(l[i]).net > 720; });
  var valid   = indices.filter(function(i) { return !l[i] || _cfCalc(l[i]).net <= 720; });
  if (blocked.length > 0 && valid.length === 0) {
    showAlert({ title: '無法下載', body: '勾選的確認書有淨工時已超過 12 小時<br>（含加班上限）！', tone: 'warning' });
    return;
  }
  if (blocked.length > 0) {
    showAlert({ title: '部分略過', body: '有 ' + blocked.length + ' 份確認書淨工時超過 12 小時未下載。', tone: 'warning' });
  }
  st._cfQueue = valid.slice();
  st._cfQTotal = valid.length;
  _cfBatchNext();
}
function _cfBatchNext() {
  var q = st._cfQueue;
  if (!q || q.length === 0) { _cfBatchBarRemove(); return; }
  var l = _cfLoad();
  var idx = q.shift();
  var item = l[idx];
  if (item) _cfOpenPrint(item);
  var done = st._cfQTotal - q.length;
  _cfBatchBarUpdate(done, st._cfQTotal, q.length > 0);
}
function _cfBatchBarUpdate(done, total, hasMore) {
  var bar = document.getElementById('cf-batch-bar');
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'cf-batch-bar';
    document.body.appendChild(bar);
  }
  var btnStyle = '', closeStyle = '';
  if (hasMore) {
    bar.innerHTML = '<span>批次下載 ' + done + ' / ' + total + ' 份</span>'
      + '<button class="cf-bar-next" onclick="_cfBatchNext()">繼續下一份 →</button>'
      + '<button class="cf-bar-close" onclick="_cfBatchBarRemove()">×</button>';
  } else {
    bar.innerHTML = '<span>✓ 全部 ' + total + ' 份下載完成</span>'
      + '<button class="cf-bar-close" onclick="_cfBatchBarRemove()">×</button>';
  }
}
function _cfBatchBarRemove() {
  var bar = document.getElementById('cf-batch-bar');
  if (bar) bar.remove();
  st._cfQueue = null;
}

</script>
</body>
</html>
